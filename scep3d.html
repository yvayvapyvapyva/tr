<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<title>3D симулятор</title>
<style>
  html,body{margin:0;height:100%;overflow:hidden;background:#9aa7b8;font-family:Arial,sans-serif;color:#16202e}
  #view{position:absolute;inset:0}
  canvas{display:block}

  /* ---------- ПАНЕЛЬ ПРИБОРОВ ---------- */
  #topUI{position:fixed;top:calc(8px + env(safe-area-inset-top));left:50%;
       transform:translateX(-50%);transform-origin:top center;z-index:12;
       display:flex;gap:12px;align-items:flex-start;padding:6px 14px;
       background:rgba(10,16,26,.88);border:1px solid #26374d;border-radius:20px;
       backdrop-filter:blur(4px);box-shadow:0 6px 24px rgba(0,0,0,.45);
       user-select:none;-webkit-user-select:none;pointer-events:none}
  .gauge{width:116px;flex:0 0 auto;align-self:stretch;display:flex;align-items:center}
  .gauge svg{display:block;width:100%;height:auto;filter:drop-shadow(0 2px 8px rgba(0,0,0,.5))}

  #startBtn{position:relative;flex:0 0 auto;margin:auto 0 4px 0;
       width:66px;height:66px;border-radius:50%;border:none;cursor:pointer;padding:0;
       background:radial-gradient(circle at 34% 28%, #46586c 0%, #243141 46%, #0e1620 100%);
       color:#6cf09c;
       display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;
       pointer-events:auto;touch-action:manipulation;
       box-shadow:0 0 0 3px #33465c,0 0 0 5px #131c26,
         inset 0 2px 5px rgba(255,255,255,.18),inset 0 -4px 8px rgba(0,0,0,.55),
         0 0 16px rgba(108,240,156,.35),0 6px 14px rgba(0,0,0,.5);
       transition:transform .08s ease, box-shadow .25s ease, color .25s ease;
       -webkit-tap-highlight-color:transparent}
  #startBtn .pwr{display:block;filter:drop-shadow(0 0 5px currentColor)}
  #startBtnTxt{font-family:Arial,sans-serif;font-size:9.5px;font-weight:bold;
       letter-spacing:.9px;text-shadow:0 0 8px currentColor}
  #startBtn:hover{box-shadow:0 0 0 3px #3d5570,0 0 0 5px #131c26,
         inset 0 2px 5px rgba(255,255,255,.22),inset 0 -4px 8px rgba(0,0,0,.55),
         0 0 24px rgba(108,240,156,.55),0 6px 14px rgba(0,0,0,.5)}
  #startBtn:active{transform:scale(.94);
       box-shadow:0 0 0 3px #33465c,0 0 0 5px #131c26,
         inset 0 3px 9px rgba(0,0,0,.7),0 0 14px rgba(108,240,156,.4)}
  #startBtn.dis{opacity:.4;pointer-events:none}
  #startBtn.kill{color:#ff9d8f;
       box-shadow:0 0 0 3px #5c2c26,0 0 0 5px #17100e,
         inset 0 2px 5px rgba(255,255,255,.14),inset 0 -4px 8px rgba(0,0,0,.55),
         0 0 20px rgba(255,90,60,.55),0 6px 14px rgba(0,0,0,.5)}
  #startBtn.kill:hover{box-shadow:0 0 0 3px #75382f,0 0 0 5px #17100e,
         inset 0 2px 5px rgba(255,255,255,.18),inset 0 -4px 8px rgba(0,0,0,.55),
         0 0 28px rgba(255,90,60,.75),0 6px 14px rgba(0,0,0,.5)}

  /* ---------- НИЖНЯЯ ПАНЕЛЬ ---------- */
  #bottomUI{position:fixed;bottom:calc(8px + env(safe-area-inset-bottom));left:50%;z-index:10;
       display:flex;align-items:stretch;width:max-content;transform-origin:bottom center;
       background:rgba(10,16,26,.86);border:1px solid #26374d;border-radius:16px;padding:8px 6px 8px;
       backdrop-filter:blur(4px);user-select:none;-webkit-user-select:none;touch-action:none;
       box-shadow:0 6px 24px rgba(0,0,0,.45);pointer-events:auto}
  .pcol{display:flex;flex-direction:column;justify-content:flex-start;align-items:center;
       flex:0 0 100px;width:100px;padding:0 7px;box-sizing:border-box}
  .pcol + .pcol{border-left:1px solid #26374d}
  .pcol.gearcol{flex:0 0 180px;width:180px}
  /* ИСПРАВЛЕНО: число под названием убрано — отступ до трека увеличен */
  .ptitle{font-size:10px;font-weight:bold;color:#8fa3bb;margin-bottom:12px;
       letter-spacing:.1px;text-transform:uppercase;white-space:nowrap}

  /* ============================================================
     СЕКЦИЯ ПЕДАЛИ 86×150:
       слева  дорожка 54px с квадратной ручкой 50×50 (×1.5)
       справа шкала 32px, прижата к правому краю
     ============================================================ */
  .pedalWrap{position:relative;width:86px;height:150px;flex:0 0 auto;
       cursor:grab;touch-action:none;-webkit-tap-highlight-color:transparent}
  .pedalWrap:active{cursor:grabbing}

  .sliderHalf{position:absolute;left:0;top:0;bottom:0;width:54px;
       background:linear-gradient(#16222f,#0d1720);
       border-radius:14px;
       box-shadow:inset 0 0 0 1px #24384d, inset 0 2px 12px rgba(0,0,0,.55)}

  .vfill{position:absolute;left:3px;right:3px;top:0;height:0;
       border-radius:11px;pointer-events:none;opacity:.9}
  #clutchFill{background:linear-gradient(180deg,#4d90d8,#1d4f80)}
  #brakeFill {background:linear-gradient(180deg,#f0705a,#8f2418)}
  #gasFill   {background:linear-gradient(180deg,#f0c65a,#8f6a1c)}

/* зона 40–60% пересчитана под V_TOP=17 / V_SPAN=66 */
  /* (зелёная зона оставлена только на шкале — см. .scaleZone) */

  /* РУЧКА: квадрат 50×50 (было 32×32, ×1.5), цвет как у 3D-накладки */
  .vthumb{position:absolute;left:2px;right:2px;top:17%;
       height:50px;margin-top:-25px;box-sizing:border-box;
       border-radius:9px;pointer-events:none;
       box-shadow:0 4px 12px rgba(0,0,0,.6),
                  inset 0 1px 2px rgba(255,255,255,.40),
                  inset 0 -3px 7px rgba(0,0,0,.40)}
  .vthumb::after{content:'';position:absolute;left:11px;right:11px;top:24px;height:2px;
       border-radius:1px;background:rgba(0,0,0,.30);
       box-shadow:0 -8px 0 rgba(0,0,0,.30), 0 8px 0 rgba(0,0,0,.30)}
  #clutchThumb{background:linear-gradient(180deg,#7cb4ec 0%,#5490d0 48%,#2c5f96 100%);border:1px solid #9ccbf7}
  #brakeThumb {background:linear-gradient(180deg,#ef7a68 0%,#d0402e 48%,#8c2317 100%);border:1px solid #ff9d8f}
  #gasThumb   {background:linear-gradient(180deg,#ffdf8a 0%,#f2c14e 48%,#a37c1d 100%);border:1px solid #ffe9b0}

  /* ---------- ШКАЛА: ПРИЖАТА К ПРАВОМУ КРАЮ ---------- */
  .scaleHalf{position:absolute;right:0;top:0;bottom:0;width:32px}
  /* подписи — правый край, выравнивание вправо */
  .scaleLbl{position:absolute;right:0;width:19px;text-align:right;
       font-size:10.5px;line-height:1;font-weight:bold;
       color:#dbe7f5;font-variant-numeric:tabular-nums;
       text-shadow:0 1px 2px rgba(0,0,0,.75),0 0 4px rgba(0,0,0,.4);
       transform:translateY(-50%);pointer-events:none;white-space:nowrap}
  /* риски идут левее подписей, тоже с привязкой к правому краю */
  .scaleTick{position:absolute;right:21px;width:5px;height:1px;
       background:#4a5f76;transform:translateY(-50%);pointer-events:none}
  .scaleTick.maj{right:20px;width:7px;height:2px;background:#93a6bb}
  .scaleTick.passed{background:var(--sc);box-shadow:0 0 4px var(--sc)}
  .scaleTick.maj.passed{background:var(--sc);box-shadow:0 0 6px var(--sc),0 0 2px var(--sc)}
.scaleZone{position:absolute;left:0;right:0;
     background:rgba(46,185,100,.35);
     box-shadow:inset 0 0 10px rgba(46,185,100,.4),0 0 8px rgba(46,185,100,.3);
     pointer-events:none}
  .scaleCursor{position:absolute;right:0;width:32px;height:2px;margin-top:-1px;
       background:currentColor;pointer-events:none;border-radius:1px;z-index:3;
       box-shadow:0 0 6px currentColor}
  #clutchCursor{color:#8fd0ff}
  #brakeCursor {color:#ff6b5a}
  #gasCursor   {color:#ffd166}

  /* ---------- ИНДИКАТОР ЗОНЫ УДЕРЖАНИЯ (левый край, по центру) ---------- */
  #holdGauge{position:fixed;left:14px;top:50%;transform:translateY(-50%);
       width:44px;height:min(300px,42vh);z-index:20;pointer-events:none;
       background:linear-gradient(rgba(22,34,47,.62),rgba(13,23,32,.62));
       border-radius:10px;overflow:hidden;backdrop-filter:blur(3px);
       box-shadow:inset 0 0 0 1px rgba(36,56,77,.85),inset 0 2px 12px rgba(0,0,0,.45)}
  #holdGauge.off{display:none}
  /* крупная шкала с зелёной зоной — риски и цифры внутри тёмной зоны */
  #holdGauge .hgScale{position:absolute;inset:0}
  #holdGauge .scaleTick{left:0;right:auto;width:7px;height:2px}
  #holdGauge .scaleTick.maj{left:0;right:auto;width:11px;height:2px}
  #holdGauge .scaleLbl{left:auto;right:3px;width:27px;text-align:right;font-size:13px;line-height:1}
  #holdGauge .scaleZone{left:0;right:0;background:rgba(46,185,100,.34);
       box-shadow:inset 0 0 12px rgba(46,185,100,.45)}
  #holdGauge .hgNow{position:absolute;left:0;right:0;top:3%;height:2px;margin-top:-1px;
       background:#8fd0ff;box-shadow:0 0 7px #8fd0ff;z-index:3}
  #holdGauge .hgLimit{position:absolute;left:0;right:0;top:3%;height:3px;margin-top:-1.5px;
       background:#5dffa0;box-shadow:0 0 8px #5dffa0;z-index:4;
       transition:background .12s,box-shadow .12s}
  #holdGauge .hgLimit.danger{background:#ff5a4a;box-shadow:0 0 10px #ff5a4a}

  /* ---------- ПРАВЫЕ ШКАЛЫ ОБОРОТОВ: МАХОВИК / ДИСК СЦЕПЛЕНИЯ ---------- */
  #scomGauges{position:fixed;right:14px;top:50%;transform:translateY(-50%);
       z-index:20;pointer-events:none;
       background:linear-gradient(rgba(22,34,47,.62),rgba(13,23,32,.62));
       border-radius:12px;overflow:hidden;backdrop-filter:blur(3px);
       box-shadow:inset 0 0 0 1px rgba(36,56,77,.85),inset 0 2px 12px rgba(0,0,0,.45);
       padding:8px 7px}
  #scomGauges .scomTitle{font-size:8.5px;font-weight:bold;color:#8fa3bb;text-align:center;
       letter-spacing:.6px;text-transform:uppercase;margin:0 0 7px;white-space:nowrap}
  #scomGauges .scomRow{display:flex;gap:8px;align-items:stretch}
  .scomScale{position:relative;width:47px;display:flex;flex-direction:column;align-items:center}
  .scomHead{font-size:9px;font-weight:bold;line-height:1.05;text-align:center;
       color:#dbe7f5;margin-bottom:4px;white-space:nowrap}
  .scomTrack{position:relative;width:100%;height:min(250px,38vh);flex:0 0 auto;
       background:rgba(9,16,26,.66);border-radius:8px;overflow:visible;
       box-shadow:inset 0 0 0 1px rgba(38,58,80,.7),inset 0 2px 10px rgba(0,0,0,.5)}
  /* риски и подписи шкалы: слева от трека */
  .scomTrack .gTick{position:absolute;left:0;width:6px;height:1px;background:#42566d;
       transform:translateY(-50%);pointer-events:none}
  .scomTrack .gTick.maj{width:9px;height:2px;background:#93a6bb}
  .scomTrack .gTick.passed{background:var(--sc);box-shadow:0 0 4px var(--sc)}
  .scomTrack .gTick.maj.passed{background:var(--sc);box-shadow:0 0 6px var(--sc),0 0 2px var(--sc)}
  .scomTrack .gLbl{position:absolute;left:11px;font-size:8.5px;line-height:1;font-weight:bold;
       color:#aebfd3;font-variant-numeric:tabular-nums;white-space:nowrap;
       text-shadow:0 1px 2px rgba(0,0,0,.7);transform:translateY(-50%);pointer-events:none}
  /* курсор текущего значения — поперёк трека */
  .scomTrack .gCursor{position:absolute;left:0;right:0;height:2px;margin-top:-1px;
       background:currentColor;box-shadow:0 0 7px currentColor;z-index:3;pointer-events:none;border-radius:1px}
  .scomDig{font-size:11px;font-weight:bold;line-height:1;margin-top:5px;white-space:nowrap;
       font-variant-numeric:tabular-nums}
  #scomDigFW{color:#ffd166;text-shadow:0 0 8px rgba(255,209,102,.55)}
  #scomDigDS{color:#8fd0ff;text-shadow:0 0 8px rgba(143,208,255,.55)}

  /* ---------- ТРЕК КПП ---------- */
  #gearTrack{position:relative;width:166px;height:150px;cursor:grab;
       overflow:visible;flex:0 0 auto;
       background:none;border:none;border-radius:0;box-shadow:none;
       pointer-events:auto;touch-action:none}
  #gearTrack:active{cursor:grabbing}
  #gateSvg{position:absolute;inset:0;width:100%;height:100%;display:block;
       pointer-events:none;overflow:visible;
       filter:drop-shadow(0 3px 10px rgba(0,0,0,.65))}
  #gearKnob{position:absolute;left:50%;top:50%;width:34px;height:34px;margin:-17px 0 0 -17px;
       border-radius:50%;pointer-events:none;z-index:5;
       background:radial-gradient(circle at 34% 28%, #9aa5b3, #3d4650 62%, #1b222a 100%);
       border:2px solid #77828f;
       box-shadow:0 4px 14px rgba(0,0,0,.8),inset 0 2px 4px rgba(255,255,255,.32)}

  /* ---------- ИНФОРМАЦИОННЫЕ ТАБЛИЧКИ ---------- */
  #msg{position:fixed;top:calc(146px + env(safe-area-inset-top));left:50%;
       transform:translateX(-50%);z-index:20;
       padding:12px 22px;border-radius:14px;font-size:15px;font-weight:bold;text-align:center;display:none;max-width:92vw}
  #msg small{display:block;font-weight:normal;font-size:12px;margin-top:5px;opacity:.85}
  #msg.warn{display:block;background:rgba(90,20,20,.82);color:#ffc2b7;border:2px solid rgba(192,57,43,.7);box-shadow:0 4px 20px rgba(192,57,43,.5)}
  #msg.info{display:block;background:rgba(18,49,79,.82);color:#a8d4ff;border:2px solid rgba(42,111,159,.7);box-shadow:0 4px 24px rgba(42,111,159,.45)}

  /* ---------- КНОПКА НАСТРОЕК — маленькая, притянута к верхнему правому
     углу панели приборов (#topUI) ---------- */
  #settingsBtn{position:absolute;top:6px;right:6px;flex:0 0 auto;
       width:32px;height:32px;border-radius:50%;border:none;cursor:pointer;padding:0;margin:0;
       background:radial-gradient(circle at 34% 28%, #3c4d66 0%, #202e40 46%, #0d1622 100%);
       color:#a8d4ff;
       display:flex;align-items:center;justify-content:center;
       pointer-events:auto;touch-action:manipulation;
       box-shadow:0 0 0 2px #33465c,0 0 0 4px #131c26,
         inset 0 1px 3px rgba(255,255,255,.18),inset 0 -3px 6px rgba(0,0,0,.55),
         0 2px 8px rgba(0,0,0,.5);
       transition:transform .08s ease,box-shadow .25s ease,color .25s ease;
       -webkit-tap-highlight-color:transparent}
  #settingsBtn svg{display:block;width:15px;height:15px;filter:drop-shadow(0 0 3px currentColor)}
  #settingsBtn:hover{background:radial-gradient(circle at 34% 28%, #47608a 0%, #273950 46%, #111d2e 100%);color:#dcecff}
  #settingsBtn:active{transform:scale(.9);
       box-shadow:0 0 0 2px #33465c,0 0 0 4px #131c26,0 0 10px rgba(120,180,255,.45)}
  #settingsOverlay{position:fixed;inset:0;z-index:40;background:rgba(4,8,14,.55);
       display:none;align-items:center;justify-content:center;padding:14px}
  #settingsOverlay.open{display:flex}
  #settingsPanel{width:min(500px,96vw);max-height:calc(100vh - 32px);
       background:rgba(13,21,32,.97);border:1px solid #2b3f58;border-radius:16px;
       box-shadow:0 18px 50px rgba(0,0,0,.6);display:flex;flex-direction:column;overflow:hidden}
  #settingsHead{display:flex;align-items:center;justify-content:space-between;padding:12px 16px;
       border-bottom:1px solid #26374d}
  #settingsHead h3{margin:0;font-size:15px;color:#e8f1fb;text-transform:uppercase;letter-spacing:.6px}
  #settingsClose{background:none;border:none;color:#8fa3bb;font-size:20px;cursor:pointer;line-height:1;padding:0 4px}
  #settingsClose:hover{color:#fff}
  #settingsBody{overflow-y:auto;padding:8px 10px 12px}
  #settingsBody h4{margin:14px 0 2px;font-size:12px;color:#6fb4e8;text-transform:uppercase;letter-spacing:.4px}
  #settingsBody .gdesc{margin:0 0 6px;font-size:11px;color:#718aa4}
  .settingsRow{display:flex;align-items:center;gap:10px;padding:5px 8px;border-radius:8px}
  .settingsRow:hover{background:rgba(44,66,92,.35)}
  .settingsRow .slab{flex:1;min-width:0}
  .settingsRow .sname{font-size:12.5px;color:#e8f1fb}
  .settingsRow .sdesc{font-size:10.5px;color:#718aa4;margin-top:1px}
  .settingsRow input{width:92px;flex:0 0 auto;background:#0a1420;color:#fff;border:1px solid #2b3f58;
       border-radius:7px;padding:5px 7px;font-size:16px;text-align:right;font-variant-numeric:tabular-nums}
  .settingsRow input:focus{outline:none;border-color:#6fb4e8;box-shadow:0 0 0 2px rgba(111,180,232,.25)}
  #settingsFoot{display:flex;gap:10px;justify-content:flex-end;padding:12px 16px;border-top:1px solid #26374d}
  #settingsFoot button{border:none;border-radius:10px;padding:8px 16px;font-size:13px;font-weight:bold;cursor:pointer}
  #settingsApply{background:linear-gradient(180deg,#4f9bdd,#2a6fb4);color:#fff}
  #settingsApply:hover{background:#5aa8e8}
  #settingsReset{background:rgba(44,66,92,.5);color:#a8d4ff}
  #settingsReset:hover{background:rgba(56,82,112,.6)}

  /* ---------- Кнопка раскрытия экспертных настроек ---------- */
  #expertBtn{display:block;width:calc(100% - 20px);margin:6px 10px 0;padding:10px 12px;
       border:none;border-radius:10px;cursor:pointer;
       background:rgba(44,66,92,.4);color:#8fa3bb;
       font-family:Arial,sans-serif;font-size:12.5px;font-weight:bold;letter-spacing:.4px;
       text-align:center;text-transform:uppercase;
       -webkit-tap-highlight-color:transparent;transition:background .15s ease,color .15s ease}
  #expertBtn:hover{background:rgba(56,82,112,.55);color:#c6d9ee}
  #expertBtn .exptxt{display:inline}
  #expertBtn.open .exptxt{display:none}
  #expertBtn .expopen{display:none}
  #expertBtn.open .expopen{display:inline}
  #expertWrap{display:none;border-top:1px dashed #26374d;margin-top:10px;padding-top:2px}

  @media (max-width:760px){
    #msg{font-size:13px;padding:10px 14px;top:calc(108px + env(safe-area-inset-top));max-width:94vw}
    #msg small{font-size:11px}
    .gauge{width:86px}
    #topUI{gap:8px;padding:5px 10px}
    #startBtn{width:54px;height:54px;margin:auto 0 3px 0}
    #startBtnTxt{font-size:8px;letter-spacing:.6px}
    #startBtn .pwr{width:15px;height:15px}
    #settingsBtn{width:32px;height:32px;top:6px;right:6px}
    #settingsBtn svg{width:15px;height:15px}
    #bottomUI{left:8px;right:8px;width:auto;padding:6px 6px}
    .pcol{flex:1 1 0;width:auto;min-width:0;padding:0 2px}
    .pcol.gearcol{flex:1.5 1 0;width:auto}
    .ptitle{font-size:9px;margin-bottom:9px}
    .pedalWrap{width:auto;align-self:stretch;min-width:44px;height:132px}
    .sliderHalf{width:auto;left:0;right:26px;border-radius:12px}
    .scaleHalf{width:26px}
    .scaleLbl{width:17px;font-size:9.5px}
    .scaleTick{right:18px;width:4px}
    .scaleTick.maj{right:17px;width:6px}
    .scaleCursor{width:26px}
    .vthumb{height:40px;margin-top:-20px;border-radius:7px}
    .vthumb::after{left:8px;right:8px;top:19px;
         box-shadow:0 -6px 0 rgba(0,0,0,.30), 0 6px 0 rgba(0,0,0,.30)}
    #gearTrack{width:auto;align-self:stretch;min-width:100px;height:132px}
    #gearKnob{width:28px;height:28px;margin:-14px 0 0 -14px}
  }
</style>
</head>
<body>
<div id="msg" class="info">Нажмите «Старт», чтобы завести двигатель</div>

<div id="settingsOverlay">
  <div id="settingsPanel">
    <div id="settingsHead">
      <h3>Настройки</h3>
      <button id="settingsClose" type="button" aria-label="Закрыть">✕</button>
    </div>
    <div id="settingsBody"></div>
    <button id="expertBtn" type="button">
      <span class="exptxt">⚙ Экспертные настройки</span>
      <span class="expopen">▾ Скрыть экспертные настройки</span>
    </button>
    <div id="settingsFoot">
      <button id="settingsReset" type="button">Сбросить</button>
      <button id="settingsApply" type="button">Применить</button>
    </div>
  </div>
</div>

<div id="topUI">
  <div class="gauge"><svg id="tachoSvg"  viewBox="-60 -60 120 120"></svg></div>
  <div class="gauge"><svg id="speedoSvg" viewBox="-60 -60 120 120"></svg></div>
  <button id="startBtn" type="button" aria-label="Старт / Стоп двигателя">
    <svg class="pwr" viewBox="0 0 24 24" width="19" height="19" aria-hidden="true">
      <path d="M12 3.2v8.4" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" fill="none"/>
      <path d="M6.6 6.9a7.9 7.9 0 1 0 10.8 0" stroke="currentColor" stroke-width="2.5"
            stroke-linecap="round" fill="none"/>
    </svg>
    <span id="startBtnTxt">СТАРТ</span>
  </button>

function makeAsphalt(){
  const c=document.createElement('canvas'); c.width=c.height=256;
  const g=c.getContext('2d');
  g.fillStyle='#3a3e44'; g.fillRect(0,0,256,256);
  for(let i=0;i<9000;i++){
    const v=Math.random();
    g.fillStyle=v<.55
      ?'rgba(255,255,255,'+(0.035+Math.random()*0.05).toFixed(3)+')'
      :'rgba(0,0,0,'+(0.05+Math.random()*0.09).toFixed(3)+')';
    g.fillRect(Math.random()*256,Math.random()*256,1,1+Math.random()*3);
  }
  for(let i=0;i<60;i++){
    g.fillStyle='rgba(0,0,0,'+(0.05+Math.random()*0.08).toFixed(3)+')';
    g.beginPath();
    g.arc(Math.random()*256,Math.random()*256,3+Math.random()*28,0,7);
    g.fill();
  }
  const tex=new THREE.CanvasTexture(c);
  tex.wrapS=tex.wrapT=THREE.RepeatWrapping;
  tex.repeat.set(2.88,12);
  const mat=new THREE.MeshStandardMaterial({map:tex,color:0xffffff,roughness:.96,metalness:0});
  const mesh=new THREE.Mesh(new THREE.PlaneGeometry(24,100),mat);
  mesh.rotation.x=-Math.PI/2;
  mesh.position.set(-1.49,-3.835,0);
  mesh.userData.noFit=true;
  scene.add(mesh);

  const lc=document.createElement('canvas'); lc.width=16; lc.height=256;
  const lg=lc.getContext('2d');
  lg.clearRect(0,0,16,256);
  lg.fillStyle='#f2f4f5';
  lg.fillRect(0,0,16,78);
  const ltex=new THREE.CanvasTexture(lc);
  ltex.wrapS=ltex.wrapT=THREE.RepeatWrapping;
  ltex.repeat.set(1,7.81);
  const lmat=new THREE.MeshStandardMaterial({map:ltex,color:0xffffff,roughness:.95,metalness:0,transparent:true});
  const line=new THREE.Mesh(new THREE.PlaneGeometry(0.4,100),lmat);
  line.rotation.x=-Math.PI/2;
  line.position.set(-1.49,-3.831,0);
  line.userData.noFit=true;
  scene.add(line);
  return {mesh,tex,mat,line,lineTex:ltex};
}

function resize(){
  const v=window.visualViewport;
  const w=(v && v.width>0) ? v.width : innerWidth;
  const h=(v && v.height>0) ? v.height : innerHeight;
  renderer.setSize(w,h); camera.aspect=w/h; camera.updateProjectionMatrix();
}

const FIT_DIR = new THREE.Vector3(0, 0, 1);
function fitCameraToScene(){
  scene.updateMatrixWorld(true);
  const box = new THREE.Box3();
  const tmp = new THREE.Box3();
  scene.traverse(obj => {
    if(obj.isGridHelper) return;
    if(obj.userData && obj.userData.noFit) return;
    if(obj.isLight) return;
    if(obj.isSprite) return;
    if(obj.isPoints) return;
    if(!obj.geometry) return;
    if(!obj.geometry.boundingBox) obj.geometry.computeBoundingBox();
    tmp.copy(obj.geometry.boundingBox).applyMatrix4(obj.matrixWorld);
    box.union(tmp);
  });
  if(box.isEmpty()) return;
  const center = box.getCenter(new THREE.Vector3());
  center.x = -1.15;
  center.y = 0;
  camera.position.copy(center).addScaledVector(FIT_DIR, 20);
  camera.up.set(0,1,0);
  camera.lookAt(center);
  camera.updateMatrixWorld();
  const camRight = new THREE.Vector3().setFromMatrixColumn(camera.matrixWorld,0).normalize();
  const camUp    = new THREE.Vector3().setFromMatrixColumn(camera.matrixWorld,1).normalize();
  const hx=(box.max.x-box.min.x)/2, hy=(box.max.y-box.min.y)/2, hz=(box.max.z-box.min.z)/2;
  const maxRight = hx*Math.abs(camRight.x) + hy*Math.abs(camRight.y) + hz*Math.abs(camRight.z);
  const maxUp    = hx*Math.abs(camUp.x)    + hy*Math.abs(camUp.y)    + hz*Math.abs(camUp.z);
  const fovV = camera.fov * Math.PI/180;
  const tanV = Math.tan(fovV/2);
  const tanH = tanV * camera.aspect;
  const distV = maxUp / tanV;
  const distH = maxRight / tanH;
  let dist = Math.max(distV, distH) * 1.6;
  camera.position.copy(center).addScaledVector(FIT_DIR, dist);
  camera.lookAt(center);
  controls.target.copy(center);
  camera.near = Math.max(0.05, dist*0.01);
  camera.far  = dist*30;
  camera.updateProjectionMatrix();
  controls.update();
}

/* ============ ПРИБОРЫ ============ */
const SVGNS='http://www.w3.org/2000/svg';
function mkEl(name,attrs){
  const e=document.createElementNS(SVGNS,name);
  for(const k in attrs) e.setAttribute(k,attrs[k]);
  return e;
}
const GA_A0=-120, GA_A1=120;
function gaAng(t){ return (GA_A0 + t*(GA_A1-GA_A0))*Math.PI/180; }
function gaPol(a,r){ return [Math.sin(a)*r, -Math.cos(a)*r]; }
function arcPath(r,t0,t1){
  const a0=gaAng(t0), a1=gaAng(t1);
  const [x0,y0]=gaPol(a0,r), [x1,y1]=gaPol(a1,r);
  const large = Math.abs(a1-a0) > Math.PI ? 1 : 0;
  return `M ${x0.toFixed(2)} ${y0.toFixed(2)} A ${r} ${r} 0 ${large} 1 ${x1.toFixed(2)} ${y1.toFixed(2)}`;
}
function buildGauge(svg,cfg){
  while(svg.firstChild) svg.removeChild(svg.firstChild);
  svg.appendChild(mkEl('circle',{cx:0,cy:0,r:56,fill:'#0b121b',stroke:'#2b3d52','stroke-width':2.5}));
  svg.appendChild(mkEl('circle',{cx:0,cy:0,r:52,fill:'#0e1723',stroke:'#1b2a3a','stroke-width':1}));
  if(cfg.greenFrom!=null && cfg.greenTo!=null){
    svg.appendChild(mkEl('path',{d:arcPath(46,cfg.greenFrom/cfg.max,cfg.greenTo/cfg.max),
      fill:'none',stroke:'#2fae5f','stroke-width':5,opacity:.95}));
  }
  if(cfg.redFrom!=null){
    const redEnd=cfg.redTo!=null?Math.min(1,cfg.redTo/cfg.max):1;
    svg.appendChild(mkEl('path',{d:arcPath(46,cfg.redFrom/cfg.max,redEnd),
      fill:'none',stroke:'#d6402c','stroke-width':5,opacity:.9}));
  }
  /* красная риска отсечки: короткая толстая метка на внешнем кольце
     точно в положении отсечки — выше неё коленвал не раскрутится */
  if(cfg.cutAt!=null){
    const half=Math.max(30,cfg.max*0.008);
    const c0=Math.max(0,(cfg.cutAt-half)/cfg.max), c1=Math.min(1,(cfg.cutAt+half)/cfg.max);
    svg.appendChild(mkEl('path',{d:arcPath(50,c0,c1),
      fill:'none',stroke:'#ff3b30','stroke-width':6,opacity:.95}));
  }
  const n=Math.round(cfg.max/cfg.step);
  for(let i=0;i<=n;i++){
    const v=i*cfg.step, t=v/cfg.max, a=gaAng(t);
    const maj=(Math.round(v)%cfg.major===0);
    const r1=maj?37:43, r2=47;
    const [x1,y1]=gaPol(a,r1), [x2,y2]=gaPol(a,r2);
    const inRed  =(cfg.redFrom!=null && v>=cfg.redFrom);
    const inGreen=(cfg.greenFrom!=null && cfg.greenTo!=null && v>=cfg.greenFrom && v<=cfg.greenTo);
    let tickCol='#6f8298';
    if(maj) tickCol = inRed ? '#ff8d7a' : (inGreen ? '#7dffa8' : '#d8e6f5');
    else if(inGreen) tickCol='#3f8f5f';
    svg.appendChild(mkEl('line',{x1:x1.toFixed(2),y1:y1.toFixed(2),x2:x2.toFixed(2),y2:y2.toFixed(2),
      stroke:tickCol,'stroke-width':maj?2.2:1.1,'stroke-linecap':'round'}));
    if(maj){
      const [tx,ty]=gaPol(a,28);
      const txt=mkEl('text',{x:tx.toFixed(2),y:(ty+3.2).toFixed(2),
        'text-anchor':'middle','font-size':cfg.numSize||10,'font-weight':'bold',
        fill:inRed?'#ff9d8f':(inGreen?'#7dffa8':cfg.color),'font-family':'Arial'});
      txt.textContent=String(Math.round(v/cfg.divider));
      svg.appendChild(txt);
    }
  }
  const unit=mkEl('text',{x:0,y:17,'text-anchor':'middle','font-size':7.5,
    fill:'#8fa3bb','font-family':'Arial','font-weight':'bold','letter-spacing':'.5'});
  unit.textContent=cfg.unit; svg.appendChild(unit);
  const dig=mkEl('text',{x:0,y:34,'text-anchor':'middle','font-size':13,
    fill:cfg.color,'font-family':'Arial','font-weight':'bold'});
  dig.textContent='0'; svg.appendChild(dig);
  const needle=mkEl('g',{});
  needle.appendChild(mkEl('path',{d:'M -2 7 L 0 -49 L 2 7 Z',fill:cfg.needle||cfg.color}));
  needle.appendChild(mkEl('circle',{cx:0,cy:0,r:4.2,fill:cfg.needle||cfg.color}));
  svg.appendChild(needle);
  svg.appendChild(mkEl('circle',{cx:0,cy:0,r:6,fill:'#16202d',stroke:cfg.color,'stroke-width':1.8}));
  svg.appendChild(mkEl('circle',{cx:0,cy:0,r:2,fill:cfg.color}));
  return {needle,dig,max:cfg.max};
}
function setGauge(g,value){
  const t=Math.max(0,Math.min(1,value/g.max));
  g.needle.setAttribute('transform','rotate('+(GA_A0 + t*(GA_A1-GA_A0)).toFixed(2)+')');
}

const settingsBtn=document.getElementById('settingsBtn');

const defaultValues={}; // заводские значения — снимок при загрузке страницы

function rebuildTacho(){
  tacho=buildGauge(document.getElementById('tachoSvg'),{
    max:PHYS.REV_LIM, step:250, major:1000, redFrom:PHYS.REV_MAX, redTo:PHYS.RED_TO,
    greenFrom:PHYS.GREEN_FROM, greenTo:PHYS.GREEN_TO,
    divider:1000, color:'#ffd166', needle:'#ff6b4a', unit:'×1000', cutAt:PHYS.REV_CUT});
}

function renderGroup(g, wrap){
  const h=document.createElement('h4'); h.textContent=g.title; wrap.appendChild(h);
  if(g.desc){ const p=document.createElement('p'); p.className='gdesc'; p.textContent=g.desc; wrap.appendChild(p); }
  g.fields.forEach(f=>{
    const row=document.createElement('div'); row.className='settingsRow';
    const lab=document.createElement('div'); lab.className='slab';
    const name=document.createElement('div'); name.className='sname'; name.textContent=f.label;
    const desc=document.createElement('div'); desc.className='sdesc'; desc.textContent=f.desc;
    lab.appendChild(name); lab.appendChild(desc);
    const inp=document.createElement('input');
    inp.type=f.type==='text'?'text':'number';
    if(f.step!=null) inp.step=f.step;
    row.appendChild(lab); row.appendChild(inp);
    wrap.appendChild(row);
    settingsFields.push({f,inp});
    if(!(f.path in defaultValues)) defaultValues[f.path]=cfgGet(f.path);
  });
}
function buildSettings(){
  settingsBody.innerHTML='';
  settingsFields.length=0;
  SETTINGS.forEach(g=>renderGroup(g, settingsBody));
  const expWrap=document.createElement('div');
  expWrap.id='expertWrap';
  EXPERT_SETTINGS.forEach(g=>renderGroup(g, expWrap));
  settingsBody.appendChild(expWrap);
}
function loadSettings(){
  settingsFields.forEach(({f,inp})=>{ inp.value=String(cfgGet(f.path)); });
}
function applySettings(){
  settingsFields.forEach(({f,inp})=>{
    if(f.type==='text'){ cfgSet(f.path, inp.value.trim()); return; }
    const v=parseFloat(inp.value);
    if(Number.isFinite(v)) cfgSet(f.path, v);
  });
  refreshDerived();
  rebuildTacho();
  rebuildScomScales();
  settingsOverlay.classList.remove('open');
}
function openSettings(){ loadSettings(); settingsOverlay.classList.add('open'); }
function closeSettings(){ settingsOverlay.classList.remove('open'); }

settingsBtn.addEventListener('click', openSettings);
document.getElementById('settingsClose').addEventListener('click', closeSettings);
settingsOverlay.addEventListener('click', e=>{ if(e.target===settingsOverlay) closeSettings(); });
document.getElementById('settingsApply').addEventListener('click', applySettings);
document.getElementById('settingsReset').addEventListener('click', ()=>{
  settingsFields.forEach(({f,inp})=>{ inp.value=String(defaultValues[f.path]); });
  applySettings();
});
buildSettings();

    gateSvg.appendChild(mkEl('line',{x1,y1,x2,y2,stroke:'#1b2b3d','stroke-width':15,'stroke-linecap':'round'}));

    gateSvg.appendChild(mkEl('line',{x1,y1,x2,y2,stroke:'#3b5872','stroke-width':3.4,'stroke-linecap':'round',opacity:.5}));
  gateSvg.appendChild(mkEl('line',{x1:X(0)+8,y1:Y(1),x2:X(2)-8,y2:Y(1),

function bezierPoint(p0,p1,p2,t,out){
  const it=1-t;
  out.set(it*it*p0.x+2*it*t*p1.x+t*t*p2.x, it*it*p0.y+2*it*t*p1.y+t*t*p2.y, it*it*p0.z+2*it*t*p1.z+t*t*p2.z);
}
function updateShiftCable(from,mid,to){
  for(let i=0;i<CABLE_SEGS;i++){
    bezierPoint(from,mid,to,i/CABLE_SEGS,_pA);
    bezierPoint(from,mid,to,(i+1)/CABLE_SEGS,_pB);
    const seg=cableSegs[i];
    seg.position.copy(_pA).lerp(_pB,0.5);
    _cDir.subVectors(_pB,_pA);
    const len=_cDir.length();
    seg.scale.set(1,len,1);
    if(len>0.0001) seg.quaternion.setFromUnitVectors(_up,_cDir.normalize());
  }
}

function makeRoundedSquareGeo(size, radius, depth){
  const s = new THREE.Shape();
  const h = size/2, r = Math.min(radius, h);
  s.moveTo(-h+r, -h); s.lineTo( h-r, -h);
  s.absarc( h-r, -h+r, r, -Math.PI/2, 0, false);
  s.lineTo( h, h-r);
  s.absarc( h-r, h-r, r, 0, Math.PI/2, false);
  s.lineTo(-h+r, h);
  s.absarc(-h+r, h-r, r, Math.PI/2, Math.PI, false);
  s.lineTo(-h, -h+r);
  s.absarc(-h+r, -h+r, r, Math.PI, Math.PI*1.5, false);
  const g = new THREE.ExtrudeGeometry(s,{depth,bevelEnabled:true,
    bevelThickness:0.015,bevelSize:0.015,bevelSegments:2});
  g.translate(0,0,-depth/2);
  return g;
}

function roundRectPath(k,x,y,w,h,r){
  k.beginPath(); k.moveTo(x+r,y);
  k.lineTo(x+w-r,y); k.quadraticCurveTo(x+w,y,x+w,y+r);
  k.lineTo(x+w,y+h-r); k.quadraticCurveTo(x+w,y+h,x+w-r,y+h);
  k.lineTo(x+r,y+h); k.quadraticCurveTo(x,y+h,x,y+h-r);
  k.lineTo(x,y+r); k.quadraticCurveTo(x,y,x+r,y);
  k.closePath();
}

let audio=null, soundOn=false;
function initAudio(){
  const AC=window.AudioContext||window.webkitAudioContext;
  const ctx=new AC();
  const comp=ctx.createDynamicsCompressor();
  comp.threshold.value=-18; comp.knee.value=12; comp.ratio.value=4; comp.attack.value=0.004; comp.release.value=0.2;
  const boost=ctx.createGain(); boost.gain.value=2.2;
  comp.connect(boost); boost.connect(ctx.destination);
  const master=ctx.createGain(); master.gain.value=0; master.connect(comp);
  const nb=ctx.createBuffer(1,ctx.sampleRate*2,ctx.sampleRate);
  const nd=nb.getChannelData(0); for(let i=0;i<nd.length;i++) nd[i]=Math.random()*2-1;
  const noise=ctx.createBufferSource(); noise.buffer=nb; noise.loop=true;
  const exhF=ctx.createBiquadFilter(); exhF.type='bandpass'; exhF.frequency.value=500; exhF.Q.value=0.6;
  const exhG=ctx.createGain(); exhG.gain.value=0;
  noise.connect(exhF); exhF.connect(exhG); exhG.connect(master);
  const slipF=ctx.createBiquadFilter(); slipF.type='bandpass'; slipF.frequency.value=1800; slipF.Q.value=0.7;
  const slipG=ctx.createGain(); slipG.gain.value=0;
  noise.connect(slipF); slipF.connect(slipG); slipG.connect(master);
  const grindF=ctx.createBiquadFilter(); grindF.type='bandpass'; grindF.frequency.value=2000; grindF.Q.value=1.1;
  const grindRattle=ctx.createGain(); grindRattle.gain.value=0.6;
  const grindLevel=ctx.createGain(); grindLevel.gain.value=0;
  const grindLFO=ctx.createOscillator(); grindLFO.type='square'; grindLFO.frequency.value=50;
  const grindLFOG=ctx.createGain(); grindLFOG.gain.value=0.45;
  grindLFO.connect(grindLFOG); grindLFOG.connect(grindRattle.gain);
  noise.connect(grindF); grindF.connect(grindRattle); grindRattle.connect(grindLevel); grindLevel.connect(master);
  grindLFO.start();
  const brkF=ctx.createBiquadFilter(); brkF.type='bandpass'; brkF.frequency.value=2400; brkF.Q.value=7;
  const brkG=ctx.createGain(); brkG.gain.value=0;
  const brkLFO=ctx.createOscillator(); brkLFO.type='sine'; brkLFO.frequency.value=6.5;
  const brkLFOG=ctx.createGain(); brkLFOG.gain.value=220;
  brkLFO.connect(brkLFOG); brkLFOG.connect(brkF.frequency);
  noise.connect(brkF); brkF.connect(brkG); brkG.connect(master);
  brkLFO.start();
  /* визг шин при пробуксовке: пронзительный тональный «крик» из трёх
     резонансных полос шума — низкий гул резины, основной пронзительный
     вой (узкая полоса 3.6 кГц = «свист»), широкий воющий слой с LFO,
     плюс двигатель на время буксы чуть заглушается, чтобы визг пере-
     крывал мотор даже на отсечке */
  const burnFund=ctx.createBiquadFilter(); burnFund.type='bandpass'; burnFund.frequency.value=1100; burnFund.Q.value=2.4;
  const burnFundG=ctx.createGain(); burnFundG.gain.value=0.55;
  const burnF=ctx.createBiquadFilter(); burnF.type='bandpass'; burnF.frequency.value=2400; burnF.Q.value=3.0;
  const burnHi=ctx.createBiquadFilter(); burnHi.type='bandpass'; burnHi.frequency.value=3600; burnHi.Q.value=9;
  const burnHG=ctx.createGain(); burnHG.gain.value=1.1;
  const burnG=ctx.createGain(); burnG.gain.value=0;
  const burnLFO=ctx.createOscillator(); burnLFO.type='sine'; burnLFO.frequency.value=13;
  const burnLFOG=ctx.createGain(); burnLFOG.gain.value=900;
  burnLFO.connect(burnLFOG); burnLFOG.connect(burnF.frequency);
  noise.connect(burnFund); burnFund.connect(burnFundG); burnFundG.connect(burnG);
  noise.connect(burnF); burnF.connect(burnG);
  noise.connect(burnHi); burnHi.connect(burnHG); burnHG.connect(burnG);
  burnG.connect(master);
  burnLFO.start();
  noise.start();
  const engF=ctx.createBiquadFilter(); engF.type='lowpass'; engF.Q.value=0.7; engF.frequency.value=1400;
  const engPeak=ctx.createBiquadFilter(); engPeak.type='peaking'; engPeak.frequency.value=450; engPeak.Q.value=0.9; engPeak.gain.value=12;
  const engG=ctx.createGain(); engG.gain.value=0;
  engF.connect(engPeak); engPeak.connect(engG); engG.connect(master);
  const o1=ctx.createOscillator(); o1.type='sawtooth';
  const o2=ctx.createOscillator(); o2.type='sawtooth'; o2.detune.value=5;
  const o3=ctx.createOscillator(); o3.type='square';
  const o4=ctx.createOscillator(); o4.type='sawtooth';
  const o5=ctx.createOscillator(); o5.type='square';
  const g2=ctx.createGain(); g2.gain.value=0.7;
  const g3=ctx.createGain(); g3.gain.value=0.35;
  const g4=ctx.createGain(); g4.gain.value=0.4;
  const g5=ctx.createGain(); g5.gain.value=0.22;
  o1.connect(engF); o2.connect(g2); g2.connect(engF); o3.connect(g3); g3.connect(engF);
  o4.connect(g4); g4.connect(engF); o5.connect(g5); g5.connect(engF);
  o1.start(); o2.start(); o3.start(); o4.start(); o5.start();
  return {ctx,master,comp,o1,o2,o3,o4,o5,engF,engG,exhF,exhG,slipG,grindLevel,brkF,brkG,burnG,noiseBuf:nb};
}
function setSoundOn(){
  if(!audio) audio=initAudio();
  if(audio.ctx.state==='suspended') audio.ctx.resume();
  soundOn=true;
  audio.master.gain.setTargetAtTime(1.0,audio.ctx.currentTime,0.05);
}
function updateSound(rpmNorm,f,sparkLevel,clash,brakeLevel,burnLevel){
  if(!audio||!soundOn) return;
  burnLevel=burnLevel||0;
  const t=audio.ctx.currentTime, k=0.08;
  const act=f>0.8?1:0;
  /* на время пробуксовки слегка глушим двигатель, чтобы визг шин был чётко
     слышен даже на фоне мотора в отсечку */
  const duck=1-0.65*Math.min(1,burnLevel);
  audio.o1.frequency.setTargetAtTime(f,t,k);
  audio.o2.frequency.setTargetAtTime(f*2,t,k);
  audio.o3.frequency.setTargetAtTime(f*3,t,k);
  audio.o4.frequency.setTargetAtTime(f*6,t,k);
  audio.o5.frequency.setTargetAtTime(f*10,t,k);
  audio.engF.frequency.setTargetAtTime(900+f*12,t,k);
  audio.engG.gain.setTargetAtTime((0.9+1.4*rpmNorm)*act*duck,t,k);
  audio.exhF.frequency.setTargetAtTime(400+f*8,t,k);
  audio.exhG.gain.setTargetAtTime((0.5+0.9*rpmNorm)*act*duck,t,k);
  audio.slipG.gain.setTargetAtTime(sparkLevel*2.2,t,0.05);
  audio.grindLevel.gain.setTargetAtTime(clash*1.0,t,0.03);
  audio.brkF.frequency.setTargetAtTime(1900+brakeLevel*2200,t,0.10);
  audio.brkG.gain.setTargetAtTime(brakeLevel*1.15,t,0.06);
  if(audio.burnG) audio.burnG.gain.setTargetAtTime(burnLevel*2.6,t,0.03);
}
let starterStop=null;
function playStarter(dur){
  dur=dur||PHYS.START_DUR;
  if(!audio) audio=initAudio();
  if(audio.ctx.state==='suspended') audio.ctx.resume();
  const ctx=audio.ctx, t0=ctx.currentTime+0.02;
  const bus=ctx.createGain(); bus.gain.value=0; bus.connect(audio.comp);
  const o=ctx.createOscillator(); o.type='sawtooth';
  o.frequency.setValueAtTime(26,t0); o.frequency.linearRampToValueAtTime(54,t0+dur);
  const og=ctx.createGain(); og.gain.value=0.4; o.connect(og); og.connect(bus);
  const o2=ctx.createOscillator(); o2.type='square'; o2.frequency.setValueAtTime(13,t0);
  o2.frequency.linearRampToValueAtTime(27,t0+dur);
  const og2=ctx.createGain(); og2.gain.value=0.2; o2.connect(og2); og2.connect(bus);
  const n=ctx.createBufferSource(); n.buffer=audio.noiseBuf; n.loop=true;
  const bp=ctx.createBiquadFilter(); bp.type='bandpass'; bp.frequency.value=240; bp.Q.value=3;
  const ng=ctx.createGain(); ng.gain.value=0.75;
  const lfo=ctx.createOscillator(); lfo.type='square'; lfo.frequency.value=19;
  const lfoG=ctx.createGain(); lfoG.gain.value=0.6;
  lfo.connect(lfoG); lfoG.connect(ng.gain);
  n.connect(bp); bp.connect(ng); ng.connect(bus);
  bus.gain.setValueAtTime(0,t0);
  bus.gain.linearRampToValueAtTime(1.1,t0+0.05);
  bus.gain.setValueAtTime(1.1,t0+dur-0.12);
  bus.gain.linearRampToValueAtTime(0,t0+dur);
  o.start(t0); o.stop(t0+dur+0.05);
  o2.start(t0); o2.stop(t0+dur+0.05);
  n.start(t0); n.stop(t0+dur+0.05);
  lfo.start(t0); lfo.stop(t0+dur+0.05);
  let stopped=false;
  return ()=>{
    if(stopped) return; stopped=true;
    const tc=ctx.currentTime, end=tc+0.1;
    bus.gain.cancelScheduledValues(tc);
    bus.gain.setValueAtTime(bus.gain.value,tc);
    bus.gain.linearRampToValueAtTime(0,tc+0.06);
    try{ o.stop(end); o2.stop(end); n.stop(end); lfo.stop(end); }catch(e){}
  };
}

/* ============================================================
   ВЕРТИКАЛЬНЫЕ ПОЛЗУНКИ ПЕДАЛЕЙ + ШКАЛА 0–100%
   верх = отпущено (0), вниз = нажатие (1)

   V_TOP/V_SPAN подобраны под ручку 50×50 px (полувысота 25 px)
   в треке 150 px, чтобы ручка не выходила за границы:
     верх (v=0): 17% × 150 = 25.5 px → ручка 0.5 … 50.5 px  ✓
     низ  (v=1): 83% × 150 = 124.5 px → ручка 99.5 … 149.5 px ✓
   ============================================================ */
const V_TOP = 17;
const V_SPAN = 66;

/* индикатор удержания — своя шкала почти без пустых полей сверху/снизу */
const HG_TOP = 3;
const HG_SPAN = 94;

function vPosPct(v){ return (V_TOP + v*V_SPAN).toFixed(3)+'%'; }
function vFillPct(v){ return (V_TOP + v*V_SPAN).toFixed(3)+'%'; }

function vFromPointer(rect, cy){
  const topPx = rect.top + rect.height*(V_TOP/100);
  const spanPx = rect.height*(V_SPAN/100);
  let v = (cy - topPx)/spanPx;
  v = Math.max(0, Math.min(1, v));
  return v;
}

/* риски и подписи шкалы; позиции считаются от тех же V_TOP/V_SPAN,
   поэтому курсор всегда на одной линии с центром ручки */
function buildScale(el, zone, accent, t0=V_TOP, sp=V_SPAN){
  el.style.setProperty('--sc',accent);
  if(zone){
    const z=document.createElement('div');
    z.className='scaleZone';
    const tHi=t0+(zone[0]/100)*sp;
    const tLo=t0+(zone[1]/100)*sp;
    z.style.top=tHi.toFixed(2)+'%';
    z.style.height=(tLo-tHi).toFixed(2)+'%';
    el.appendChild(z);
  }
  const ticks=[], labels=[];
  for(let pc=0; pc<=100; pc+=5){
    const maj=(pc%20===0);
    const top=t0+(pc/100)*sp;
    const t=document.createElement('i');
    t.className='scaleTick'+(maj?' maj':'');
    t.style.top=top.toFixed(2)+'%';
    el.appendChild(t);
    ticks.push({el:t, pct:pc});
    if(maj){
      const b=document.createElement('b');
      b.className='scaleLbl';
      b.style.top=top.toFixed(2)+'%';
      b.textContent=String(pc);
      el.appendChild(b);
      labels.push({el:b, pct:pc});
    }
  }
  return {ticks, labels};
}

function bindVSlider(wrapEl, fillEl, thumbEl, cursorEl, onChange, onRelease){
  let dragging=false;
  const paint=(v)=>{
    const pos=vPosPct(v);
    fillEl.style.height=vFillPct(v);
    thumbEl.style.top=pos;
    if(cursorEl) cursorEl.style.top=pos;
  };
  const apply=(cy)=>{
    const rect=wrapEl.getBoundingClientRect();
    const v=vFromPointer(rect,cy);
    paint(v);
    if(onChange) onChange(v);
  };
  const sliderEl=wrapEl.querySelector('.sliderHalf');
  wrapEl.addEventListener('pointerdown',e=>{
    if(sliderEl){
      const r=sliderEl.getBoundingClientRect();
      if(e.clientX<r.left || e.clientX>r.right) return;
    }
    dragging=true;
    try{wrapEl.setPointerCapture(e.pointerId);}catch(_){}
    apply(e.clientY); e.preventDefault();
  });
  wrapEl.addEventListener('pointermove',e=>{ if(dragging) apply(e.clientY); });
  const stop=()=>{
    if(!dragging) return;
    dragging=false;
    if(onRelease) onRelease();
  };
  wrapEl.addEventListener('pointerup',stop);
  wrapEl.addEventListener('pointercancel',stop);
  wrapEl.addEventListener('lostpointercapture',stop);
  return { set:paint, isDragging(){ return dragging; } };
}

const sim = new Transmission();

const clutchScaleData = buildScale(document.getElementById('clutchScale'), [40,60],'#8fd0ff');
const brakeScaleData  = buildScale(document.getElementById('brakeScale'),  null,'#ff6b5a');
const gasScaleData    = buildScale(document.getElementById('gasScale'),    null,'#ffd166');

/* индикатор зоны удержания: отдельный элемент у левого края */
const holdGaugeEl =document.getElementById('holdGauge');
const hgLimitEl   =document.getElementById('hgLimit');
const hgNowEl     =document.getElementById('hgNow');
const hgScaleData =buildScale(document.getElementById('hgScale'), [40,60], '#8fd0ff', HG_TOP, HG_SPAN);

/* правые шкалы оборотов: маховик и диск сцепления.
   Шкала от 0 до REV_LIM (по нему строится тахометр) */
const scomTrackFW=document.getElementById('scomTrackFW');
const scomTrackDS=document.getElementById('scomTrackDS');
const scomDigFW=document.getElementById('scomDigFW');
const scomDigDS=document.getElementById('scomDigDS');
const scomCursorFW=document.createElement('div'), scomCursorDS=document.createElement('div');
scomCursorFW.className='gCursor'; scomCursorFW.style.color='#ffd166';
scomCursorDS.className='gCursor'; scomCursorDS.style.color='#8fd0ff';
function buildScomTicks(trackEl, accent){
  trackEl.style.setProperty('--sc',accent);
  const ticks=[];
  const max=PHYS.REV_LIM;
  const n=Math.round(max/500);
  for(let i=0;i<=n;i++){
    const v=i*500, pct=100*v/max;
    const maj=(v%1000===0);
    const t=document.createElement('i');
    t.className='gTick'+(maj?' maj':'');
    t.style.top=(100-pct).toFixed(2)+'%';   /* низ = 0, верх = максимум */
    trackEl.appendChild(t);
    ticks.push({el:t,pct});
    if(maj){
      const b=document.createElement('b');
      b.className='gLbl';
      b.style.top=(100-pct).toFixed(2)+'%';
      b.textContent=String(v/1000);
      trackEl.appendChild(b);
    }
  }
  return ticks;
}
function rebuildScomScales(){
  scomTrackFW.innerHTML=''; scomTrackDS.innerHTML='';
  const fw=buildScomTicks(scomTrackFW,'#ffd166');
  const ds=buildScomTicks(scomTrackDS,'#8fd0ff');
  scomTicksFW.length=0; scomTicksDS.length=0;
  scomTicksFW.push(...fw); scomTicksDS.push(...ds);
  scomTrackFW.appendChild(scomCursorFW); scomTrackDS.appendChild(scomCursorDS);
  setScomCursor(scomCursorFW, scomDigFW, 0);
  setScomCursor(scomCursorDS, scomDigDS, 0);
}
const scomTicksFW=[], scomTicksDS=[];
function setScomCursor(cursorEl, digEl, rpm){
  const max=PHYS.REV_LIM;
  const pct=Math.max(0,Math.min(100,100*rpm/max));
  cursorEl.style.top=(100-pct).toFixed(2)+'%';   /* низ = 0, верх = максимум */
  const r=Math.round(rpm);
  digEl.textContent=(r>=1000)?(r/1000).toFixed(1).replace(/\.0$/,'')+'k':String(r);
}
function highlightScomTicks(data, pct){
  for(const t of data) t.el.classList.toggle('passed', t.pct<=pct);
}
rebuildScomScales();

function highlightScale(data, pct){
  const lim=pct*100;
  for(const t of data.ticks) t.el.classList.toggle('passed', t.pct<=lim);
}

clutchSlider.set(0); brakeSlider.set(0); gasSlider.set(0);

/* ============ РЫЧАГ КПП ============ */
const gearTrack=document.getElementById('gearTrack');
const gearKnob=document.getElementById('gearKnob');
let gearDrag=false;
shifter.position.x=sim.shifterTargetX;

function gearFromPointer(cx,cy){
  const rect=gearTrack.getBoundingClientRect();
  const nx=Math.max(0,Math.min(1,(cx-rect.left)/rect.width));
  const ny=Math.max(0,Math.min(1,(cy-rect.top)/rect.height));
  sim.dragGear(nx,ny);
}
function gearRelease(){
  if(!gearDrag) return;
  gearDrag=false;
  sim.releaseGear();
}
gearTrack.addEventListener('pointerdown',e=>{
  gearDrag=true; sim.beginGearDrag();
  try{gearTrack.setPointerCapture(e.pointerId);}catch(_){}
  gearFromPointer(e.clientX,e.clientY); e.preventDefault();
});
gearTrack.addEventListener('pointermove',e=>{ if(gearDrag) gearFromPointer(e.clientX,e.clientY); });
gearTrack.addEventListener('pointerup',gearRelease);
gearTrack.addEventListener('pointercancel',gearRelease);

addEventListener('keydown',e=>{
  const t=e.target;
  if(t && (t.tagName==='INPUT'||t.tagName==='TEXTAREA'||t.isContentEditable)) return;
  if(e.code==='Space'&&!e.repeat){ sim.setClutch(1); e.preventDefault(); }
  if((e.code==='KeyB'||e.code==='ArrowDown')&&!e.repeat){ sim.holdBrake(true); e.preventDefault(); }
  const k=e.key.toUpperCase();
  if('12345RN'.includes(k) && k.length===1){ sim.keyGear(k); e.preventDefault(); }
});
addEventListener('keyup',e=>{
  if(e.code==='Space'){ sim.setClutch(0); e.preventDefault(); }
  if(e.code==='KeyB'||e.code==='ArrowDown'){ sim.holdBrake(false); e.preventDefault(); }
});

/* ============ СОСТОЯНИЕ ДВИГАТЕЛЯ ============ */
const msgEl=document.getElementById('msg');
const startBtn=document.getElementById('startBtn');
const startBtnTxt=document.getElementById('startBtnTxt');
function showMsg(html,cls){ msgEl.innerHTML=html; msgEl.className=cls; }
function hideMsg(){ msgEl.className=''; msgEl.textContent=''; }
startBtn.addEventListener('click',()=>{
  const act=sim.pressStart();
  if(act==='started'){ setSoundOn(); if(starterStop) starterStop(); starterStop=playStarter(); }
});

/* ============ ФИЗИКА И АНИМАЦИЯ ============ */
let tachoShown=0, speedoShown=0, hgLimShown=null;
let lastClutch=0, lastGas=0, lastBrake=0;
let msgShown=null;

fitAll();

const clock=new THREE.Clock(); let hudT=0;
let wheelAngle=0;   /* реальный угол поворота колеса, рад */
renderer.setAnimationLoop(()=>{
  let dt=Math.min(clock.getDelta(),.05);

  sim.setBrakeDragging(brakeSlider.isDragging());
  sim.step(dt);
  if(sim.engineState!=='cranking' && starterStop){ starterStop(); starterStop=null; }

  crank.rotation.x=sim.thE; flywheel.rotation.x=sim.thE;
  clutchDisc.position.x=sim.cdx;
  clutchDisc.rotation.x=sim.discAng;
  forkG.rotation.z=sim.gf*0.25;
  gA.rotation.x=sim.discAng; gD.rotation.x=-sim.axleAng;

  {
    const gateT=sim.gateT, rowT=sim.rowT;
    shifter.position.x += (sim.shifterTargetX-shifter.position.x)*Math.min(1,dt*10);
    gearLever3D.rotation.x=(rowT-0.5)*0.9;
    gearLever3D.rotation.z=(0.5-gateT)*0.7;
  }

  {
    _cFrom.set(SHIFTER_POS.x,SHIFTER_POS.y+0.10,SHIFTER_POS.z-0.28);
    _cTo.set(shifter.position.x-0.16,OUT_Y+0.25,0);
    _cMid.set((_cFrom.x+_cTo.x)*0.5,Math.min(_cFrom.y,_cTo.y)-0.20,(_cFrom.z+_cTo.z)*0.5);
    updateShiftCable(_cFrom,_cMid,_cTo);
  }

  MESH.x=(GA_X+shifter.position.x)/2;
  MESH.y=(0+OUT_Y)/2;
  MESH.z=0;
  grindLight.position.set(MESH.x,MESH.y,MESH.z);

  gearKnob.style.left=(sim.leverNX*100).toFixed(2)+'%';
  gearKnob.style.top=(sim.leverNY*100).toFixed(2)+'%';

  const PEDAL_ANGLE=0.5+Math.PI/4-20*Math.PI/180;
  pedal3D_clutch.rotation.x = sim.p      * PEDAL_ANGLE;
  pedal3D_brake.rotation.x  = sim.brakeP * PEDAL_ANGLE;
  pedal3D_gas.rotation.x    = sim.gasP   * PEDAL_ANGLE;

  wheelAngle += (sim.aOmega/PHYS.SLOW)*dt*0.5;   /* ω колеса = v / R, рад/с (×0.5 — наглядность) */
  wheel.userData.rotor.rotation.x=-wheelAngle;
  wheelL.userData.rotor.rotation.x=-wheelAngle;
  const gOff = wheelAngle * WHEEL_R / (100/12);
  asphaltGround.tex.offset.y = gOff % 1;
  asphaltGround.lineTex.offset.y = (gOff * (8.334/12.8)) % 1;

  for(let i=0;i<cylXs.length;i++){
    const x=cylXs[i], psi=sim.thE+phases[i];
    const py=CR*Math.cos(psi), pz=CR*Math.sin(psi);
    const ypis=py+Math.sqrt(Math.max(RL*RL-pz*pz,0));
    pistons[i].position.set(x,ypis+0.18,0);
    rods[i].position.set(x,(py+ypis)/2,pz/2);
    rods[i].rotation.x=Math.atan2(-pz,ypis-py);
    bigEnds[i].position.set(x,py,pz);
    let ign=Math.pow(Math.max(0,Math.cos(psi)),6);
    if(sim.engineState!=='running') ign=0;
    const cb=combs[i];
    cb.mat.opacity=ign;
    const sc=0.25+ign*0.1; cb.s.scale.set(sc,sc,1);
    cb.L.intensity=ign*7.5;
  }

  const brakeLevel=sim.brakeLevel;
  const hh=Math.min(1,sim.brakeHeat*1.15+brakeLevel*0.25);
  M.brakeHot.color.copy(DISC_COLD).lerp(DISC_HOT,hh);
  M.brakeHot.emissiveIntensity=hh*hh*3.0;
  M.brakeHot.roughness=0.40-hh*0.22;
  M.caliper.emissiveIntensity=sim.brakeP*(0.65+0.55*sim.speedN)*2.3;
  if(brakeLevel>0.01){
    brakeEmitAcc += dt*(110+1700*brakeLevel)*brakeLevel;
    while(brakeEmitAcc>=1){ brakeEmitAcc-=1; spawnBrakeSpark(brakes[(Math.random()<0.5)?0:1]); }
  } else brakeEmitAcc=0;
  const flick=brakeLevel>0.01 ? brakeLevel*(5.0+Math.random()*3.5) : 0;
  for(let i=0;i<brakes.length;i++) brakes[i].L.intensity=flick+sim.brakeHeat*sim.brakeHeat*1.8;

  const sparkLevel=sim.sparkLevel;
  emitAcc+=dt*(60+700*sparkLevel)*sparkLevel;
  while(emitAcc>=1){ emitAcc-=1; spawnSpark(sim.gx); }

  const clash=sim.clash;
  if(clash>0.02){
    grindAcc+=dt*(300+1300*clash)*clash;
    while(grindAcc>=1){ grindAcc-=1; spawnGearSpark(); }
  } else grindAcc=0;
  grindLight.intensity=clash>0?clash*(6.0+Math.random()*4.5):0;

  /* дым от пробуксовки: чем сильнее колёса обгоняют кузов, тем гуще */
  const spinDiff=Math.abs(sim.aOmega-sim.wc);
  const burnN=Math.max(0,Math.min(1,(spinDiff/PHYS.SLOW-1.5)/5));
  if(burnN>0.02){
    smokeAcc+=dt*(30+650*burnN);
    while(smokeAcc>=1){ smokeAcc-=1; spawnSmoke(Math.random()<0.5?WX:LWX,burnN); }
  } else smokeAcc=0;
  for(let i=0;i<SMOKE_N;i++){
    if(smokeLife[i]>0){
      smokeLife[i]-=dt;
      smokeVel[i*3+1]+=1.0*dt;                       /* дым поднимается */
      smokeVel[i*3  ]-=smokeVel[i*3  ]*0.35*dt;      /* и оседает на месте */
      smokeVel[i*3+2]-=smokeVel[i*3+2]*0.35*dt;
      smokePos[i*3  ]+=smokeVel[i*3  ]*dt;
      smokePos[i*3+1]+=smokeVel[i*3+1]*dt;
      smokePos[i*3+2]+=smokeVel[i*3+2]*dt;
      const f=Math.max(0,smokeLife[i]/smokeMax[i]);
      const fA=f*f;
      smokeAttrS[i]=smokeSize[i]*(1.9-1.1*f);        /* клубок растёт */
      smokeAttrA[i]=smokeA[i]*fA;                    /* и тает */
      if(f<=0){ smokePos[i*3+1]=-999; smokeAttrS[i]=0; smokeAttrA[i]=0; }
    }
  }
  smokeGeo.attributes.position.needsUpdate=true;
  smokeGeo.attributes.size.needsUpdate=true;
  smokeGeo.attributes.alpha.needsUpdate=true;

  for(let i=0;i<SPARK_N;i++){
    if(sparkLife[i]>0){
      sparkLife[i]-=dt;
      sparkVel[i*3+1]-=2.2*dt;
      sparkPos[i*3]+=sparkVel[i*3]*dt;
      sparkPos[i*3+1]+=sparkVel[i*3+1]*dt;
      sparkPos[i*3+2]+=sparkVel[i*3+2]*dt;
      const f0=Math.max(0,sparkLife[i]/sparkMax[i]);
      sparkCol[i*3]=Math.min(1,f0*2.6);
      sparkCol[i*3+1]=Math.min(1,f0*2.1);
      sparkCol[i*3+2]=Math.min(1,f0*1.4);
      if(sparkLife[i]<=0){ sparkPos[i*3+1]=-999; sparkCol[i*3]=sparkCol[i*3+1]=sparkCol[i*3+2]=0; }
    }
  }
  sparkGeo.attributes.position.needsUpdate=true;
  sparkGeo.attributes.color.needsUpdate=true;

  glowRing.position.x=sim.gx;
  glowMat.opacity=sparkLevel>0?Math.min(1,sparkLevel*1.5)*(0.85+Math.random()*0.25):0;
  const gsc=0.9+sparkLevel*0.35; glowRing.scale.set(gsc,gsc,gsc);
  sparkLight.position.set(sim.gx,0.4,0.4);
  sparkLight.intensity=sparkLevel>0?sparkLevel*(4.5+Math.random()*3.0):0;
  const slipGlow=sim.clutchSlipping?(sim.e*Math.pow(sim.slip,1.5)*0.03+sparkLevel*1.2):0;
  M.orange.emissiveIntensity=Math.min(2.0,slipGlow);

  const rpmNow=sim.engOmega/PHYS.SLOW*9.549;
  updateSound(Math.max(0,Math.min(1.5,(rpmNow-PHYS.IDLE_RPM)/3200)),rpmNow/60,sparkLevel,clash,brakeLevel,burnN);

  const rpmFW=rpmNow;                        /* маховик = коленвал */
  const rpmDS=sim.dOmega/PHYS.SLOW*9.549;    /* диск сцепления */
  setScomCursor(scomCursorFW, scomDigFW, rpmFW);
  setScomCursor(scomCursorDS, scomDigDS, rpmDS);
  highlightScomTicks(scomTicksFW, 100*rpmFW/PHYS.REV_LIM);
  highlightScomTicks(scomTicksDS, 100*rpmDS/PHYS.REV_LIM);

  const wheelRpm=sim.aOmega/PHYS.SLOW*9.549;
  const speedKmh=wheelRpm*PHYS.SPEED_K;
  const absSpeed=Math.abs(speedKmh);
  const speedDisp=absSpeed*(1+PHYS.SPEED_ERR/100);
  tachoShown += (rpmNow-tachoShown)*Math.min(1,dt*9);
  speedoShown += (speedDisp-speedoShown)*Math.min(1,dt*9);
  setGauge(tacho,tachoShown);
  setGauge(speedo,speedoShown);

  if(sim.msg){
    if(msgShown==null || msgShown.html!==sim.msg.html || msgShown.cls!==sim.msg.cls){
      showMsg(sim.msg.html, sim.msg.cls);
      msgShown={html:sim.msg.html, cls:sim.msg.cls};
    }
  } else if(msgShown!=null){
    hideMsg(); msgShown=null;
  }

  if(sim.p!==lastClutch){ lastClutch=sim.p; clutchSlider.set(sim.p); }
  if(sim.brakeP!==lastBrake){ lastBrake=sim.brakeP; brakeSlider.set(sim.brakeP); }
  if(sim.gasP!==lastGas){ lastGas=sim.gasP; gasSlider.set(sim.gasP); }

  /* индикатор удержания — каждый кадр, чтобы не отставал от педали.
     Положение полоски предела сглаживается: releaseLimit() пересчитывается
     по живому состоянию симуляции и между кадрами «дёргается» на несколько
     процентов — фильтр тянет отображаемое значение к цели плавно, без
     скачков. Опасная зона при этом считается по истинному пределу. */
  const hgLim=sim.releaseLimit();
  if(hgLim==null){
    holdGaugeEl.classList.add('off');
    hgLimShown=null;
  } else {
    holdGaugeEl.classList.remove('off');
    if(hgLimShown==null) hgLimShown=hgLim;
    else hgLimShown+=(hgLim-hgLimShown)*Math.min(1,dt*8);
    hgLimitEl.style.top=(HG_TOP+hgLimShown*HG_SPAN).toFixed(2)+'%';
    hgLimitEl.classList.toggle('danger', sim.p<hgLim-0.005);
    hgNowEl.style.top=(HG_TOP+sim.p*HG_SPAN).toFixed(2)+'%';
    highlightScale(hgScaleData, sim.p);
  }

  hudT+=dt;
  if(hudT>0.08){
    hudT=0;
    tacho.dig.textContent=Math.round(tachoShown);
    speedo.dig.textContent=Math.round(speedoShown);
    engLabel.userData.draw(Math.round(rpmNow));
    psLabel.userData.draw(sim.engineState==='running'?Math.round(enginePowerPS(rpmNow)):0);
    whlLabel.userData.draw(Math.round(speedDisp));
    highlightScale(clutchScaleData,sim.p);
    highlightScale(brakeScaleData,sim.brakeP);
    highlightScale(gasScaleData,sim.gasP);
    for(const k in gateLabelEls){
      const on=(k===String(sim.gearSel));
      gateLabelEls[k].setAttribute('fill',on?(k==='R'?'#ff9d8f':'#6cf09c'):'#93a6bb');
      gateLabelEls[k].setAttribute('font-size',on?'11.5':'9.5');
    }
    if(sim.engineState==='running'){
      startBtnTxt.textContent='СТОП';
      startBtn.classList.add('kill');
      startBtn.classList.remove('dis');
    } else {
      startBtnTxt.textContent='СТАРТ';
      startBtn.classList.remove('kill');
      startBtn.classList.toggle('dis',sim.engineState==='cranking');
    }
  }

  controls.update();
  renderer.render(scene,camera);
});
</script>
